<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Web Dasar - MPI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .quiz-container { max-width: 800px; margin: 40px auto; background-color: rgba(12, 227, 227, 0.05); border: 2px solid var(--neon-cyan); padding: 30px; border-radius: 15px; position: relative; min-height: 60vh; }
        
        /* Layar Login */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
        .input-group { width: 100%; max-width: 400px; margin-bottom: 15px; text-align: left; }
        .input-group input { width: 100%; padding: 12px; background: transparent; border: 2px solid var(--neon-cyan); color: white; border-radius: 5px; margin-top: 5px; outline: none; }
        
        /* Layar Soal */
        .question-screen { display: none; }
        .question-text { font-size: 1.4rem; margin-bottom: 20px; color: white; }
        .option-btn { display: block; width: 100%; background-color: #1a2533; padding: 15px; border: 1px solid #2a3b4c; color: white; text-align: left; border-radius: 8px; margin-bottom: 10px; cursor: pointer; font-size: 1.1rem; transition: 0.3s; }
        .option-btn:hover { background-color: var(--neon-cyan); color: black; }
        
        .btn-submit { background-color: var(--neon-cyan); color: var(--bg-color); padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 100%; max-width: 400px; }
        
        /* Pop-up Hasil */
        .result-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #0d131a; border: 4px solid var(--neon-cyan); padding: 40px; text-align: center; border-radius: 20px; z-index: 100; box-shadow: 0 0 50px var(--neon-cyan); }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" style="color: var(--neon-cyan); text-decoration: none; position: absolute; left: 30px; top: 30px; font-size: 1.2rem;"><i class="fa-solid fa-arrow-left"></i> KEMBALI</a>
        <h1 class="title-glow">KUIS WEB & TABEL</h1>
    </div>

    <div class="quiz-container">
        <!-- Layar Login (Adaptasi Video) -->
        <div id="login-screen">
            <p>Isi data dirimu sebelum memulai kuis.</p>
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" id="inputNama" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Kelas</label>
                <input type="text" id="inputKelas" autocomplete="off">
            </div>
            <button class="btn-submit" onclick="mulaiKuis()">Mulai Kuis</button>
        </div>

        <!-- Area Soal yang berubah dinamis -->
        <div id="quiz-area" class="question-screen">
            <h3 style="color: var(--neon-cyan);" id="q-number">Soal 1 dari 3</h3>
            <div class="question-text" id="q-text">Pertanyaan akan muncul di sini</div>
            <div id="options-area">
                <!-- Tombol pilihan ganda di-generate JS -->
            </div>
        </div>
    </div>

    <!-- Pop-up Hasil (Adaptasi Video) -->
    <div id="popup" class="result-popup">
        <h3 id="hasil-identitas" style="margin: 0; color: white;">Nama - Kelas</h3>
        <div style="border-top: 1px solid var(--neon-cyan); margin: 15px 0;"></div>
        <h2 id="pesan-kelulusan" style="margin: 0;"></h2>
        <p>Nilai kamu:</p>
        <h1 id="skor-akhir" style="color: var(--neon-cyan); font-size: 4rem; margin: 0;">0</h1><br>
        <a href="index.html" class="btn-submit" style="text-decoration: none; display: inline-block;">TUTUP KUIS</a>
    </div>

    <script>
        // Data Soal
        // Data Soal HTML & CSS Dasar
        const bankSoal = [
            { 
                soal: "Manakah tag HTML Dasar yang benar untuk membuat paragraf?", 
                opsi: ["A. <p>", "B. <br>", "C. <h1>", "D. <table>"], 
                jawaban: 0 
            },
            { 
                soal: "Pada materi HTML Lanjutan, tag yang digunakan untuk menyatukan dua baris dalam tabel adalah...", 
                opsi: ["A. colspan", "B. rowspan", "C. merge", "D. spacing"], 
                jawaban: 1 
            },
            { 
                soal: "Untuk membuat kotak input berupa pilihan titik yang hanya bisa dipilih salah satu (seperti Jenis Kelamin), tipe input apa yang digunakan?", 
                opsi: ["A. checkbox", "B. password", "C. text", "D. radio"], 
                jawaban: 3 
            },
            { 
                soal: "Sintaks CSS Dasar yang benar untuk mengubah warna latar belakang halaman web menjadi biru adalah...", 
                opsi: ["A. body { color: blue; }", "B. bg-color: blue;", "C. body { background-color: blue; }", "D. <body style='blue'>"], 
                jawaban: 2 
            },
            { 
                soal: "Apa kepanjangan dari CSS?", 
                opsi: ["A. Computer Style Sheets", "B. Cascading Style Sheets", "C. Creative Style System", "D. Code Style Sheet"], 
                jawaban: 1 
            }
        ];

        let indexSoalSaatIni = 0;
        let skor = 0;

        function mulaiKuis() {
            let nama = document.getElementById("inputNama").value;
            let kelas = document.getElementById("inputKelas").value;
            if(nama === "" || kelas === "") { alert("Isi Nama dan Kelas!"); return; }
            
            document.getElementById("hasil-identitas").innerText = nama.toUpperCase() + " | " + kelas;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("quiz-area").style.display = "block";
            tampilkanSoal();
        }

        function tampilkanSoal() {
            let soalSkrg = bankSoal[indexSoalSaatIni];
            document.getElementById("q-number").innerText = "Soal " + (indexSoalSaatIni + 1) + " dari " + bankSoal.length;
            document.getElementById("q-text").innerText = soalSkrg.soal;
            
            let htmlOpsi = "";
            for(let i=0; i<soalSkrg.opsi.length; i++) {
                htmlOpsi += `<button class="option-btn" onclick="cekJawaban(${i})">${soalSkrg.opsi[i]}</button>`;
            }
            document.getElementById("options-area").innerHTML = htmlOpsi;
        }

        function cekJawaban(indeksPilihan) {
            let jawabanBenar = bankSoal[indexSoalSaatIni].jawaban;
            
            // Logika umpan balik seperti di video
            if(indeksPilihan === jawabanBenar) {
                skor += (100 / bankSoal.length);
                alert("Jawabanmu Tepat! Lanjut ke soal berikutnya.");
            } else {
                alert("Jawabanmu Kurang Tepat. Mari lanjut ke soal berikutnya.");
            }

            indexSoalSaatIni++;
            if(indexSoalSaatIni < bankSoal.length) {
                tampilkanSoal();
            } else {
                selesaiKuis();
            }
        }

        function selesaiKuis() {
            document.getElementById("quiz-area").style.display = "none";
            document.getElementById("skor-akhir").innerText = Math.round(skor);
            
            let pesan = document.getElementById("pesan-kelulusan");
            if(skor >= 75) {
                pesan.innerText = "LULUS!";
                pesan.style.color = "#0ce3e3";
            } else {
                pesan.innerText = "PERLU BELAJAR LAGI";
                pesan.style.color = "#ff3b30";
            }
            document.getElementById("popup").style.display = "block";
        }
    </script>
</body>
</html>
